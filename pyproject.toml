[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signaldesk-deploy"
version = "0.1.0"
description = "SignalDesk skeleton for signaldesk-deploy"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk_deploy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
