services:
  diagnostic-worker:
    command: ["python", "/opt/signaldesk/e2e-crash-worker.py", "diagnostic"]
    volumes:
      - ./scripts/e2e-crash-worker.py:/opt/signaldesk/e2e-crash-worker.py:ro
    environment:
      SIGNALDESK_DIAGNOSTIC_WORKER_BLOCK_TIME_MS: "100"
      SIGNALDESK_DIAGNOSTIC_WORKER_STALE_IDLE_MS: "1200"
      SIGNALDESK_DIAGNOSTIC_WORKER_API_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_DIAGNOSTIC_WORKER_REDIS_CONNECT_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_DIAGNOSTIC_WORKER_REDIS_SOCKET_TIMEOUT_SECONDS: "0.5"
      SIGNALDESK_DIAGNOSTIC_WORKER_DIAGNOSTIC_CONNECT_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_DIAGNOSTIC_WORKER_DIAGNOSTIC_READ_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_DIAGNOSTIC_WORKER_DIAGNOSTIC_TOTAL_TIMEOUT_SECONDS: "0.1"

  email-worker:
    command: ["python", "/opt/signaldesk/e2e-crash-worker.py", "email"]
    volumes:
      - ./scripts/e2e-crash-worker.py:/opt/signaldesk/e2e-crash-worker.py:ro
    environment:
      SIGNALDESK_EMAIL_WORKER_BLOCK_TIME_MS: "100"
      SIGNALDESK_EMAIL_WORKER_STALE_IDLE_MS: "7000"
      SIGNALDESK_EMAIL_WORKER_REDIS_CONNECT_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_EMAIL_WORKER_REDIS_SOCKET_TIMEOUT_SECONDS: "0.5"
      SIGNALDESK_EMAIL_WORKER_API_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_EMAIL_WORKER_MAILPIT_API_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_EMAIL_WORKER_SMTP_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_EMAIL_WORKER_RECOVERY_AGE_SECONDS: "1.0"

  export-worker:
    command: ["python", "/opt/signaldesk/e2e-crash-worker.py", "export"]
    volumes:
      - ./scripts/e2e-crash-worker.py:/opt/signaldesk/e2e-crash-worker.py:ro
    environment:
      SIGNALDESK_EXPORT_WORKER_BLOCK_TIME_MS: "100"
      SIGNALDESK_EXPORT_WORKER_STALE_IDLE_MS: "1500"
      SIGNALDESK_EXPORT_WORKER_REDIS_CONNECT_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_EXPORT_WORKER_REDIS_SOCKET_TIMEOUT_SECONDS: "0.5"
      SIGNALDESK_EXPORT_WORKER_API_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_EXPORT_WORKER_DIAGNOSTICS_TOTAL_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_EXPORT_WORKER_OBJECT_STORE_TIMEOUT_SECONDS: "0.1"
      SIGNALDESK_EXPORT_WORKER_RENDER_TIMEOUT_SECONDS: "0.1"
